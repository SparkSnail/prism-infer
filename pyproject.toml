[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-infer"
version = "0.3.0"
authors = [{ name = "SparkSnail" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "LLM inference engine, a fork of nano-vllm with extensions (MoE, PD disaggregation, EP, etc.)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "nats-py>=2.7",
    "pydantic>=2.6",
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "uvicorn[standard]>=0.29",
    "xxhash",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
# flash-attn needs CUDA and is best installed from a prebuilt wheel (see README);
# kept optional so CPU-only installs / CI do not try to build it from source.
gpu = ["flash-attn"]

[project.urls]
Homepage="https://github.com/SparkSnail/prism-infer"

[project.scripts]
prism-infer-worker = "prism_infer.server.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_infer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

