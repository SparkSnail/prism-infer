[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-infer"
version = "0.3.0"
authors = [{ name = "SparkSnail" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "LLM inference engine, a fork of nano-vllm with extensions (MoE, PD disaggregation, EP, etc.)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "xxhash",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# flash-attn needs CUDA and is best installed from a prebuilt wheel (see README);
# kept optional so CPU-only installs / CI do not try to build it from source.
gpu = ["flash-attn"]

[project.urls]
Homepage="https://github.com/SparkSnail/prism-infer"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_infer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

